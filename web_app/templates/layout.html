
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Web App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color: #f8f9fa;">

    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #17365d;">
        <div class="container">

            <a class="navbar-brand" href="/">
                🎮 My Web App
            </a>

            <div class="navbar-nav flex-row gap-3">
                <a class="nav-link text-white" href="/">Home</a>
                <a class="nav-link text-white" href="/about">About</a>
                <a class="nav-link text-white" href="/rps/form">RPS Game</a>
                <a class="nav-link text-white" href="/stocks/form">Stocks</a>
            </div>

        </div>
    </nav>

    <div class="container mt-4">

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}
        {% endblock %}

    </div>

    <footer class="container mt-5 mb-4 text-muted">
        <hr>
        <p>OPAN 3244 Web Application Exercise</p>
    </footer>

</body>
</html>
